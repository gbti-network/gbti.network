# What the weekly digest says about membership, and who sponsors it, and whether a new subscriber has to
# confirm by email before it starts arriving. Owner-editable: change a line here, push, and the sync applies it
# to the live mail with NO REDEPLOY.
#
# A CHANGE IS LIVE WITHIN ABOUT A MINUTE OF LANDING ON MAIN. The sync workflow runs on a push that touches this
# file, so a save from the digest manager takes effect once its pull request merges, not on the next scheduled
# run. sow-270 corrected this paragraph: it used to say the manager called the sync itself, and it never did,
# so an edit here could sit unapplied for up to six hours. Nothing needed to be triggered by hand then either,
# which is what made the claim hard to catch.
#
# SUPERADMIN-owned, pinned in CODEOWNERS and in membership/path-rank.mjs. Two tests fail if those two and the
# Worker's action table ever disagree about who may write this file.
#
# AN EMPTY OR UNREADABLE VALUE FALLS BACK TO THE COPY COMPILED INTO THE RENDERER, one field at a time, not all
# at once. An issue that goes out with last month's wording is a smaller failure than one that goes out with
# no pitch at all. The sponsor is the opposite direction and for the same reason: absent means OFF, because
# rendering an advertisement by accident is not recoverable.
#
# EVERY NOTE BELOW LIVES UP HERE ON PURPOSE, AND MOVING ONE BACK INTO THE DOCUMENT DELETES IT. A save from the
# manager keeps the comment block above the first line of data and re-writes everything under it from the
# parsed values, so a comment sitting beside a field survives until the first superadmin edit and then is gone
# with no warning. That happened to this file once and it is why it reads like this.
#
#
# cta: the one membership note in the mail. It sits after all the articles, before the footer, and it renders
# only for an issue that actually has articles in it.
#
#   enabled     true to render it. Turning it off leaves the issue with no membership pitch at all.
#
#   body        THREE RULES, AND THEY WARN RATHER THAN REFUSE (owner, 2026-09-19). The manager tells you which
#               one your copy breaks and saves it anyway:
#                 1. at most 220 visible characters, body and link label together
#                 2. one link, which is the link below, so no second link in the body
#                 3. do not name something a free account already has. Collections and favourites are free,
#                    and the design mockup claims them as membership benefits in two places, so it is an easy
#                    mistake to re-inherit.
#
#               {plan} IS A BINDING, NOT A WORD. It becomes the current plan name when the mail renders, so
#               renaming the plan never leaves a stale name in somebody's inbox. Delete the token and you are
#               spelling it by hand.
#
#   link_label  the words on the one link.
#   link_url    where it goes. A path is resolved against the site, a full https link is used as it is.
#
#
# sponsor: one standing sponsor block, not one per issue (owner, 2026-09-19).
#
#   enabled     OFF, and off is the default in code as well, so a missing or broken file can never turn this
#               on. Turning it on renders the block in every issue until you change it, under a "Sponsored"
#               label the manager cannot edit away.
#
#   html        the sponsor's own markup. It is passed through an allowlist before it renders: links, images,
#               basic text tags and a short list of attributes. Anything else is dropped, including scripts,
#               frames and event handlers. Mail clients strip scripts anyway, which is exactly why this is
#               easy to under-build: the same markup feeds the preview, and a preview is a browser.
#
#               Leave it empty and the block does not render even when enabled is true, because a "Sponsored"
#               label over nothing is worse than no block.
#
#
# optin: whether a new subscriber must confirm by email before they are enrolled (sow-270).
#
#   double      false (the default) enrolls an address the moment the form is submitted and sends no
#               confirmation. true holds it unconfirmed for 48 hours and enrolls nobody until somebody clicks
#               the link in a confirmation email.
#
#               THIS IS THE RECORD OF WHAT A STRANGER CONSENTED TO, which is why it is superadmin and why the
#               audit carries the value. It also decides whether the confirmation email and its landing page
#               are ever seen at all: with this off, nothing reaches them.
#
#               ABSENT MEANS OFF AND SO DOES UNREADABLE. Owner ruling 2026-09-20, with the risk taken on the
#               record: if you turn this ON and the mirror sync breaks, addresses are enrolled without
#               confirming until it recovers. That is the opposite of the fail direction the retired Worker
#               variable had, so it is said plainly here rather than left to be rediscovered and "fixed".
#
#               A CHANGE HERE IS NOT INSTANT EVERYWHERE. Saving from the manager refreshes the mirror the mail
#               system reads, which takes about a minute; a hand edit pushed to the repository waits for the
#               next scheduled sync.
cta:
  enabled: false
  body: >-
    A {plan} membership adds comments on any item, the members Discord, and publishing your own articles,
    projects and prompts: members first, public after editorial review.
  link_label: What membership includes
  link_url: /membership/
sponsor:
  enabled: false
  html: ''
optin:
  double: false
