# SOW-080: the flat, git-native TOPIC VOCABULARY a member can follow (stored in prefs.categories). DECOUPLED from the
# content taxonomy (house/taxonomy.yml) so the follow-topic list grows without re-tagging any content. Read by
# src/lib/taxonomy.ts (the site build + /topics.json), validated against house/topic-map.yml, and rendered by the
# topic pickers. Each entry is a kebab-case key -> { label, group }. Admin-owned (house/** is CODEOWNED). A topic that
# is ALSO a content-taxonomy primary drives the browse drill-down; a topic with a house/topic-map.yml entry also biases
# the news feed; otherwise a topic is a browse/interest follow. No em/en dashes.
#
# sow-227: `group` is the HEADING a topic sits under in the share composer and the follow-topic grid (owner,
# 2026-09-23: mirror the superadmin Categories screen). It names either a TOP-LEVEL key of house/taxonomy.yml, whose
# label and order the heading takes (rename DevOps there and the heading follows), or a key of `groups:` below, for
# topics the category tree has no place for. Those headings follow the tree's, in the order written here. A group that
# names neither lands under "More topics", and test/topics-vocab.test.mjs fails until it is fixed.
groups:
  making: { label: "Making & Science" }
  life: { label: "Life & Interests" }
topics:
  # DevOps (the Categories screen heading)
  accessibility: { label: Accessibility, group: devops }
