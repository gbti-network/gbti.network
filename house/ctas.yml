# sow-281: the registered content CTAs. A CTA is one reusable partner call to action (a label, the one sentence the
# card shows, the button text, the direct destination, the partner it belongs to) plus the list of content items it
# is assigned to. Only a superadmin edits this file (it is pinned in CODEOWNERS and membership/path-rank.mjs, the
# same way house/site-settings.yml is), and the assignment lives HERE beside its CTA, never in the item's
# frontmatter, so assigning never rewrites a member's file and a member cannot attach a partner link to their own
# work. Disable a CTA to retire it (the quotes convention); do not delete it.
#
# Fields: id (kebab, unique), label, line (the sentence on the card), button (the button text, naming the partner),
# destination (an absolute https URL), partner (a short kebab label), enabled, note (free text: where the URL came
# from, whose tag it carries), items (a list of { type, ref }; type is prompt, post, project or share; ref is the
# slug, or author/id for a share).
#
# sow-337 added the card's layout and the parts a layout uses (all optional; a card with no layout is text only):
#   layout     below (title, sentence, image, button), first (image on top), compact (small image beside the
#              words), image (the image is the link, with a footer naming the destination), html (the partner's
#              own code), or text (title, sentence, button). Image layouts need an image; html needs html.
#   image      a WebP file name in house/images/ctas/, with no camera, location or colour-profile data in it
#   icon       the button icon: a React Icons name, its set, view box and SVG shapes, copied here so a page
#              needs no icon library (only plain shape elements and attributes are accepted)
#   html       the partner's code, rendered as written, scripts included
#   showTitle  false hides the title above an html block
#   hosts      the https origins the html loads from; the build opens the page policy to exactly these, only on
#              the pages the card is assigned to
#
# THE AMAZON RULE (Associates Program Policies, read 2026-09-15): a purchase reached "by a link that sends users
# indirectly to an Amazon Site via an intermediate site" is disqualified, and a placement must not make it unclear
# that the link leads to Amazon. So an amazon CTA links STRAIGHT to an amazon domain with the Associates tag in
# the URL, never through /outbound/ or any other redirect, and its button names Amazon. The edit core refuses
# anything else. The sow-289 click board therefore does not count these clicks.
ctas:
  - id: stranger-in-a-strange-land
    label: Stranger in a Strange Land
    layout: below
    line: Have you read Robert Heinlein's Stranger in a Strange Land?
    button: Get the book on Amazon
    destination: https://www.amazon.com/dp/B00005QTH2?tag=jakolorbbookc-20
    partner: amazon
    image: stranger-in-a-strange-land.webp
    icon:
      name: FaAmazon
      set: Font Awesome 5
      viewBox: 0 0 448 512
      attrs:
        fill: currentColor
        stroke: currentColor
        stroke-width: '0'
      shapes:
