name: Unit tests

# Secret-free unit suite for the membership trust core, the REST clients, the PR-gate, the reconcile
# planner, and the signup Worker logic. Runs on pull_request (safe on fork code: no secrets) and on
# push to main. This is part of the trigger split (review hardening #4): only the metadata gate runs
# on pull_request_target with secrets; everything testable runs here without them.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Keep --ignore-scripts (no lifecycle scripts run in CI), but do NOT omit optional deps: esbuild ships
      # its platform binary (@esbuild/linux-x64) as an optionalDependency, and test/extension-build-define.test.mjs
      # invokes esbuild. --omit=optional made that binary absent, failing the build-define guards in CI only.
      - run: npm ci --ignore-scripts
      - run: npm test

  # sow-215 Check B: the WorkBench preview must APPLY the article shell contract, not merely import it.
  # Its own job because it is the only check here that needs a browser, and because a browser install should
  # not sit in front of the secret-free unit suite. It needs no dist, no network and no secrets: the harness
  # serves a skeleton page and drives the real applyPreviewShell, so it is as safe on fork PRs as `npm test`.
  #
  # REQUIRE_BROWSER=1 is the point of the job. The script skips green when Playwright or Chromium is missing,
  # which is right on a laptop and wrong here: without the flag a CI box that never ran `playwright install`
  # would report success forever, which is the vacuous pass this SOW exists to catch. The flag turns both
  # skip paths, the import and the launch, into failures.
  preview-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run check:preview-shell
        env:
          REQUIRE_BROWSER: '1'
