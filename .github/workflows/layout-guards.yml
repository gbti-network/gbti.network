name: Layout guards

# sow-248: the rendering guards (check:overflow, check:csp) ran nowhere in CI. Both need a built site and a
# Chromium, which the deploy's verify step deliberately does not carry, so a table that pushed a phone page
# 200px sideways shipped and stayed for weeks with every commit green. This runs the overflow guard on a fresh
# build once a week. It is NOT in the deploy path on purpose: a Playwright pass over the shape sample costs
# minutes, and a layout regression is worth a weekly alert, not a blocked deploy.
#
# sow-288: check:csp runs here too, as a second step, with REQUIRE_BROWSER=1 on both guards so a missing browser or
# a missing build is a red rather than a green skip (owner decision 2026-09-09: a weekly report, not a deploy
# block). Both guards refuse to pass on zero pages. The gate was measured once against a real build before
# this step was added; the result is recorded in sow-288.

on:
  schedule:
    - cron: '13 5 * * 1'   # Mondays 05:13 UTC (off the hour)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  overflow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # The site build reads git history for the activity heat grid; a shallow clone renders it empty.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Full install (not --ignore-scripts): the astro build needs sharp's native binary for image optimization.
      - run: npm ci
      - name: Install the guard's Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the site
        run: npm run build
        env:
          GBTI_CF_ANALYTICS_TOKEN: ${{ vars.GBTI_CF_ANALYTICS_TOKEN }}
      - name: Overflow guard (every content shape, three viewports)
        run: npm run check:overflow
        env:
          REQUIRE_BROWSER: '1'
      - name: CSP guard (force-enforced policy, every content shape)
        if: always()
        run: npm run check:csp
        env:
          REQUIRE_BROWSER: '1'
      # sow-298: a SCHEDULED failure has nobody watching it (GitHub emails the automation account that last
      # touched this file, and the per-commit board stays green). This step never fails the job: if: failure()
      # and the script always exits zero.
      - name: "Report failure to #github-events"
        if: failure()
        run: node scripts/notify-workflow-failure.mjs
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
