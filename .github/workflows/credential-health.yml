name: Credential health

# Weekly (and on-demand) probe of the live credentials. Emails the owner via Resend when a credential is failing
# or near expiry, so a lapsed token never breaks the system silently. The job also fails (red) on any problem, as
# a backup signal if email is unconfigured. See .data/ops/secrets-ops/README.md.

on:
  schedule:
    - cron: '23 13 * * 1'   # Mondays 13:23 UTC (off the hour)
  workflow_dispatch:
    inputs:
      warn_days:
        description: 'Expiry-warning window in days. Use a very large value (e.g. 99999) to force a test alert email.'
        required: false
        default: '30'

permissions:
  contents: read

concurrency:
  group: credential-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No deps needed: the script uses node fetch + the local Resend client.
      - name: Probe credentials and alert
        run: node scripts/check-credentials.mjs
        env:
          GITHUB_BOT_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORG_URN: ${{ secrets.LINKEDIN_ORG_URN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # sow-213: probed with mustExpire, because its expiry IS its compensating control (Cloudflare
          # cannot confine a KV token by namespace, so it is confined by time instead).
          CF_KV_READ_TOKEN: ${{ secrets.CF_KV_READ_TOKEN }}
          # sow-292: the two non-secret identifiers the KV freshness probes need (overrides:mirror, coupons:config),
          # inlined exactly as reconcile.yml inlines them. The read token above is the credential; these only say where.
          CF_ACCOUNT_ID: "d42b12e969229c5187ad0f7289536487"
          CF_KV_NAMESPACE_ID: "49432379e11844ac81b6fdaf22d3937a"
          # 2026-09-07: the SITE + WORKER deploy token, probed with mustExpire. It was widened that day from
          # Pages-only to Workers Scripts + Workers Routes and given its first TTL (2027-10-01). Until then it
          # was probed by nothing, so an absent probe and a passing one looked identical in a green run.
          # One token authenticates BOTH deploy workflows, so a silent lapse freezes the site and the Worker
          # together. Removing this line does not fail anything; it just stops the check, which is the point.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # sow-279: RESEND_API_KEY also arms the coupon-alarm self-test, which sends ONE REAL EMAIL a week to
          # the recipient in workers/signup/wrangler.toml, subject-prefixed `[alarm self-test]`. That alarm is
          # the only control on three uncapped free-year codes, and it spent a day looking present while
          # sending nothing, so it is probed rather than assumed. No extra secret: the recipient and sender are
          # read from the checked-out Worker config. Removing this key silently disables that probe.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          GITHUB_CONTENT_REPO: gbti-network/gbti.network
          CRED_WARN_DAYS: ${{ github.event.inputs.warn_days || '30' }}
      # sow-298: a SCHEDULED failure has nobody watching it. GitHub emails the account that last touched this
      # workflow file (gbtilabs, an automation inbox), and the per-commit checks board stays green because a
      # scheduled run is not attached to a commit. That combination hid a three-day Reconcile outage in August
      # 2026. This step never fails the job: it is if: failure() and the script always exits zero.
      - name: "Report failure to #github-events"
        if: failure()
        run: node scripts/notify-workflow-failure.mjs
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
