name: Reconcile membership

# SOW-005 reconciliation. Brings published content + Discord roles in line with the Stripe registry
# plus git-native overrides (bans, grandfather). Runs daily on a schedule and on demand.
#
# The owner runs it LOCALLY FIRST with a dry run to review the plan before any scheduled apply:
#   node scripts/reconcile.mjs --dry-run   # prints the plan, changes nothing
#   node scripts/reconcile.mjs --apply     # enacts it
# This workflow runs the apply path. The reconcile is idempotent: a no-op run yields an empty plan.

on:
  schedule:
    - cron: '17 7 * * *'   # daily at 07:17 UTC (off the hour to avoid the cron rush)
  workflow_dispatch: {}
  # The checkout-success return URL (SOW-002 Worker) fires repository_dispatch type 'regate' with
  # client_payload.github_id after a payment, so a just-paid member is reconciled immediately (held
  # PRs released, Discord role upgraded, content published) instead of waiting for the daily run.
  # SOW-038 P3: 'admin-reconcile' (no client_payload.github_id) is the superadmin dashboard "Run reconcile"
  # button -> a FULL --apply run (targetedGithubId returns null without a github_id). Same run step.
  # SOW-157: 'enroll' fires from the Worker's hosted-authoring 409 (folder_not_provisioned) with
  # client_payload.github_id, so a paid hosted member's members-index entry lands within minutes.
  repository_dispatch:
    types: [regate, admin-reconcile, enroll]

# Least privilege: the reconcile authenticates to GitHub with GITHUB_BOT_TOKEN (a content-write PAT),
# not the default workflow token, so the bot identity (admin in roles.yml) is the PR author the gate sees.
permissions:
  contents: read

concurrency:
  # sow-213 Step 3: every workflow that writes the overrides:mirror shares this group (cancel-in-progress: false)
  # so no two read-modify-writes of the blob overlap now that bans + grandfathers are KV-native. Also covers
  # sync-overrides-mirror.yml and e2e-smoke.yml (a FULL e2e writes a sentinel grant to KV).
  group: overrides-writers
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Reconcile (apply)
        run: node scripts/reconcile.mjs --apply
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          # GH_BOT_TOKEN: GitHub forbids a GITHUB_-prefixed secret name, so the gbtilabs PAT is stored as
          # GH_BOT_TOKEN and injected into the GITHUB_BOT_TOKEN env var the script reads. The repo is a constant.
          GITHUB_BOT_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
          GITHUB_CONTENT_REPO: gbti-network/gbti.network
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          # Discord guild + role ids are non-secret production constants (acting on them needs the bot
          # token), so they are inlined here rather than stored as Actions secrets. The Locked role is
          # assigned to lapsed/banned accounts so they are locked out via the role's channel overwrites
          # while staying in the guild; the reconcile only assigns it.
          DISCORD_GUILD_ID: "1073029070411006053"
          DISCORD_MEMBER_ROLE_ID: "1511810502970441900"
          DISCORD_TRIAL_ROLE_ID: "1511800465107583198"
          DISCORD_LOCKED_ROLE_ID: "1512558475341987990"
          # sow-185: the Content-Creator badge role. LIVE as of 2026-08-28 (owner-questions.md Q33). It was
          # committed INERT because shouldSyncCreatorRole gates it on a populated Stripe price map and this
          # workflow passed no price env; the five vars below are what activate it.
          DISCORD_CREATOR_ROLE_ID: "1536102140802633788"
          # sow-185: FIVE price vars, not four, and the fifth is the one that is easy to drop. The four
          # PRICE_ENV vars name the new member/creator prices; STRIPE_PRICE_ID is the LEGACY $150 annual and
          # buildEnvPriceTierMap seeds it as CREATOR (membership/tier-gate.mjs:33), which is deliberate: it is
          # the price every pre-tier paying member is on, and they keep full access. Omitting it would not
          # merely leave them unbadged, it would resolve their price to `none` (tierForPrice fails closed
          # since 2026-08-11) and demote them. Copy all five as a block; never retype one.
          # PUBLIC, non-secret price ids, already committed in workers/signup/wrangler.toml
          # [env.production.vars]. Keep in sync with it and with pr-membership-gate.yml.
          STRIPE_PRICE_ID: price_1Tg5NHBFxyhSkuibXFrQyqaN
          STRIPE_PRICE_MEMBER_MONTHLY: price_1U2d31BFxyhSkuibpiaNGku5
          STRIPE_PRICE_MEMBER_ANNUAL: price_1U2d31BFxyhSkuibfNpQKcX0
          STRIPE_PRICE_CREATOR_MONTHLY: price_1U2d32BFxyhSkuibQJHXnU3F
          STRIPE_PRICE_CREATOR_ANNUAL: price_1U2d32BFxyhSkuibPBqOdOZs
          # Resolve a grandfathered/banned member's Discord user id when they have NO Stripe customer (so
          # their managed role still syncs). Same login->discord_user_id map the content-syndication
          # workflow uses; discord_user_id is kept OUT of the public repo, so it rides this Actions secret.
          DISCORD_MENTION_OVERRIDES: ${{ secrets.DISCORD_MENTION_OVERRIDES }}
          # Day-87 trial reminder: email (Resend) is the PRIMARY channel, the Discord DM is secondary.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Non-secret sender address (must be on the Resend-verified gbti.network domain). Change here if desired.
          RESEND_FROM: "GBTI Network <noreply@gbti.network>"
          # SOW-016: mirror the effective overrides (ban > staff > grandfather) into the Worker's SIGNUP_KV
          # so POST /membership/decrypt + GET /membership/status read a fresh blob. Without these three,
          # scripts/lib/kv-mirror.mjs no-ops silently and the Worker fails closed once the mirror ages past
          # MAX_OVERRIDES_AGE_MS (48h), denying effective-paid members. CF_KV_NAMESPACE_ID must equal the
          # Worker's SIGNUP_KV id; CF_API_TOKEN is scoped to Workers KV Storage Edit on that one namespace.
          # CF_ACCOUNT_ID + CF_KV_NAMESPACE_ID are non-secret identifiers, inlined like the rest; only
          # CF_API_TOKEN (scoped to Workers KV Storage Edit on this namespace) is a real secret to set.
          CF_ACCOUNT_ID: "d42b12e969229c5187ad0f7289536487"
          CF_KV_NAMESPACE_ID: "49432379e11844ac81b6fdaf22d3937a"
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      # sow-291: the manifest-vs-registry drift guard, relocated here from the unit suite. It asserts the
      # committed code-free house/campaigns.yml still matches the projection of the LIVE coupons:config, which
      # needs CF creds to read the KV registry. It cannot live in tests.yml, which runs on pull_request and so
      # executes FORK code: adding CF_API_TOKEN (a KV-write credential) there would hand it to anyone opening a
      # PR (same class as pull_request_target). For a static campaign set this is always green; it reds if a
      # coupon changed in KV without regenerating the manifest, which is exactly the divergence that would send a
      # lander advertising a tier it does not grant. The step reds the job so the failure-report step below fires.
      - name: Campaign manifest drift check
        run: node scripts/build-campaign-manifest.mjs --check
        env:
          CF_ACCOUNT_ID: "d42b12e969229c5187ad0f7289536487"
          CF_KV_NAMESPACE_ID: "49432379e11844ac81b6fdaf22d3937a"
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      # sow-298: a SCHEDULED failure has nobody watching it. GitHub emails the account that last touched this
      # workflow file (gbtilabs, an automation inbox), and the per-commit checks board stays green because a
      # scheduled run is not attached to a commit. That combination hid a three-day Reconcile outage in August
      # 2026. This step never fails the job: it is if: failure() and the script always exits zero.
      - name: "Report failure to #github-events"
        if: failure()
        run: node scripts/notify-workflow-failure.mjs
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
