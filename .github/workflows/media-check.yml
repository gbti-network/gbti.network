name: Media check

# Enforce the content media policy (content-schemas.md): no committed video, web image formats
# only, a per-image size cap, and podcast audio only in public/media/podcasts/. Runs on content PRs and on pushes to main.
on:
  pull_request:
    paths:
      - 'house/**'
      - 'members/**'
      - 'public/media/**'
  push:
    branches: [main]
    paths:
      - 'house/**'
      - 'members/**'
      - 'public/media/**'

jobs:
  media-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The checker measures image dimensions (sharp) and reads the item frontmatter (js-yaml) since 112e76a3, so it
      # needs the packages. Without this step every run died on ERR_MODULE_NOT_FOUND before checking anything.
      - run: npm ci
      - run: node scripts/check-media.mjs
