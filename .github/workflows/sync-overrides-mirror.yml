name: Sync overrides mirror

# Keeps the signup Worker's effective-paid gating (ban > staff > grandfather > Stripe) alive by refreshing the
# `overrides:mirror` blob in SIGNUP_KV frequently and INDEPENDENTLY of the daily reconcile. The Worker fails
# closed once the mirror is older than 48h (MAX_OVERRIDES_AGE_MS), denying paid members + superadmins. The daily
# reconcile also writes the mirror, but couples its freshness to the WHOLE reconcile succeeding (an earlier
# failure aborts before the mirror write). This job does ONLY the mirror write (read 3 house/ files -> one KV
# PUT, ~1s), so the gate can never be starved by an unrelated reconcile failure.
#
# SOW-058: the same run ALSO mirrors house/syndication-config.yml -> KV `synd:config` (the drain's enable flag,
# channels, approval, and hold). That sync is likewise Stripe-free (CF token only), so it rides this job + its
# 6-hour cron — flipping `enabled: true` then running this Action is the fast way to (de)activate syndication.
#
# Run locally: node scripts/sync-overrides-mirror.mjs --dry-run

on:
  schedule:
    - cron: '23 */6 * * *'   # every 6 hours (off the hour); 4x/day keeps the blob far inside the 48h window
  workflow_dispatch: {}
  # sow-270: the merge itself is the trigger. Every file listed here is one this job reads, so landing a change
  # to any of them refreshes the edge copy within about a minute instead of on the next 6-hour tick.
  #
  # WHY THE MERGE AND NOT THE SAVE. The admin endpoint saves by opening a pull request, and the dispatch below
  # fires the moment that pull request OPENS. A worker-opened pull request merges in about 25 seconds (measured
  # over the last 40 merges), and a dispatched runner reaches its checkout in roughly the same time, so a
  # save-time dispatch is a coin flip on whether it reads the new value or the old one. Worse, losing that race
  # writes the OLD value over the mirror and the setting then stays stale until the next tick, which is the
  # failure the immediate refresh was added to prevent. A push trigger cannot race: the commit it runs on is
  # the merge commit, so the value is already on main before the runner starts.
  push:
    branches: [main]
    paths:
      - 'house/roles.yml'            # effective status: ban > staff > grandfather > Stripe
      - 'house/bans.yml'
      - 'house/grandfathered.yml'
      - 'house/syndication-config.yml'  # synd:config, the drain's switches
      - 'house/coupons.yml'             # coupons:config, validated at signup
      - 'house/digest-config.yml'       # digest:config, incl. the sow-270 confirmation switch
  # The signup Worker can fire repository_dispatch type 'sync-mirror' after a role/ban/grandfather change so the
  # mirror refreshes immediately instead of waiting for the next 6-hour tick. sow-270: kept, but it is the slower
  # and racier of the two paths (see the push trigger above), and it has not fired once in the 200 runs going back
  # to 2026-08-03. The push trigger is what a config save should be relying on.
  repository_dispatch:
    types: [sync-mirror]

permissions:
  contents: read

concurrency:
  # sow-213 Step 3: shared with reconcile.yml + e2e-smoke.yml so no two overrides:mirror writers overlap.
  group: overrides-writers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # sow-295: a manual run from a branch other than main would run that branch's code against live systems. Refuse
      # it before anything else. This stops accidents, not a malicious branch (a branch's own copy of this file can drop
      # the step). test/workflow-main-only.test.mjs requires it as the first step of every job.
      - name: Refuse a manual run from a branch other than main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "::error title=Run refused::This workflow writes to live systems and runs from main only. It was started from '${REF_NAME}', so nothing ran. Merge the change to main, then run it again."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Sync overrides mirror
        run: node scripts/sync-overrides-mirror.mjs
        env:
          # CF_ACCOUNT_ID + CF_KV_NAMESPACE_ID are non-secret identifiers (acting on them needs the token), so they
          # are inlined like in reconcile.yml. CF_KV_NAMESPACE_ID MUST equal the production Worker's SIGNUP_KV id.
          # Only CF_API_TOKEN (scoped to Workers KV Storage Edit on this namespace) is a real secret. If the token
          # is missing the script exits non-zero (a red run), never a silent no-op.
          CF_ACCOUNT_ID: "d42b12e969229c5187ad0f7289536487"
          CF_KV_NAMESPACE_ID: "49432379e11844ac81b6fdaf22d3937a"
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      # sow-298: a SCHEDULED failure has nobody watching it. GitHub emails the account that last touched this
      # workflow file (gbtilabs, an automation inbox), and the per-commit checks board stays green because a
      # scheduled run is not attached to a commit. That combination hid a three-day Reconcile outage in August
      # 2026. This step never fails the job: it is if: failure() and the script always exits zero.
      - name: "Report failure to #github-events"
        if: failure()
        run: node scripts/notify-workflow-failure.mjs
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
