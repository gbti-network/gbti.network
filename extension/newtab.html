<!doctype html>
<!-- SOW-017 + SOW-036 + SOW-039: the GBTI Network new-tab page. The shared member-hub shell (top bar + account
     menu) is injected by shell.mjs; this page owns the feed with three view modes (compact / detailed / card) +
     per-item content thumbnails. V3 tokens, light + dark, CSP-safe.
     sow-296: reshaped around the HERO SHARE BAR (the homepage's collapsed composer, src/pages/index.astro), with
     the feed centred under it, the seven feed tabs in a row where the left rail used to be, and no sidebar. The
     landing splash, the greeting and the top-bar "+" went with that change. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Intentionally blank: a non-breaking space (not an empty title) so the new-tab override shows NO label
       instead of Chrome's localized "New Tab" fallback. -->
  <title>&nbsp;</title>
  <!-- No-flash theme: external (not inline) because MV3 extension_pages CSP forbids inline scripts. -->
  <script src="dist/theme-init.js"></script>
  <link rel="stylesheet" href="shell.css" />
  <style>
    /* feed + main-column styles (the shell chrome lives in shell.css). sow-296: the greeting is gone; the top row
       is the brand + the control cluster, both injected by the shell. */

    /* sow-296: THE HERO. The homepage's collapsed composer bar (.home-share-bar in src/styles/gbti-v3.css), ported
       to the extension's tokens. One affordance: it opens the same share composer the top-bar "+" used to. */
    .nt-share { display: flex; align-items: center; margin: 4px 0 18px; background: var(--paper); border: 1.5px solid var(--line); border-radius: var(--r); }
    .nt-share-open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; padding: 13px 16px; background: none; border: 0; font: inherit; text-align: left; cursor: pointer; color: inherit; }
    .nt-share-av { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex: none; background: var(--green-tint); }
    .nt-share-prompt { flex: 1; min-width: 0; display: flex; align-items: center; gap: 3px; font-size: 14.5px; color: var(--fg-mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nt-share-caret { width: 1.5px; height: 17px; background: var(--fg-mute); flex: none; animation: nt-caret 1.1s steps(1) infinite; }
    @keyframes nt-caret { 50% { opacity: 0; } }
    .nt-share-act { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--fg-mute); flex: none; white-space: nowrap; }
    .nt-share-act svg { width: 19px; height: 19px; flex: none; color: var(--green); }
    .nt-share-open:hover .nt-share-prompt, .nt-share-open:hover .nt-share-act { color: var(--fg); }
    @media (prefers-reduced-motion: reduce) { .nt-share-caret { animation: none; } }

    /* View-mode switch — SOW-052 relocates it into the shell control cluster ([data-modes-slot]). It is hidden
       while still a direct child of the greeting (before newtab.mjs moves it into the slot), so there is no flash;
       once nested inside the slot it shows. (Latest/Following + the feed search now live in the left rail, styled
       by shell.css.) */
    .nt-more { display: block; width: 100%; margin: 14px 0 4px; padding: 10px 16px; font-size: 12.5px; text-align: center; color: var(--fg-mute); }
    .nt-modes { display: flex; gap: 2px; background: var(--paper-3); border: 1.5px solid var(--line); border-radius: var(--r); padding: 3px; }
    .nt-greet > .nt-modes { display: none; }
    .nt-mode { width: 36px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--fg-mute); background: none; border: 0; cursor: pointer; border-radius: 6px; transition: all .14s; }
    .nt-mode:hover { color: var(--fg); }
    .nt-mode.on { background: var(--paper); color: var(--green-700); box-shadow: var(--sh-sm); }
    .nt-mode svg { width: 17px; height: 17px; }

    /* sow-296: THE FEED TAB ROW, in place of the left rail. It renders the SHARED list (client-ui/src/feed-nav.mjs,
       which the website's FEED_NAV reads too), so a label change lands on both hosts. The row carries the feed
       search and the Latest / Following scope that used to sit at the top of the rail. Narrow widths scroll the
       tabs horizontally rather than wrapping into a block that pushes the feed down the page. */
    .nt-feednav { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 0 0 16px; padding-bottom: 10px; border-bottom: 1.5px solid var(--line); }
    /* The tabs never shrink (flex-shrink 0), so when the search and the scope toggle stop fitting beside them they
       WRAP to a second line instead of pushing tabs out of sight. max-width keeps the row inside the column at
       phone widths, where the tabs scroll horizontally within their own strip. */
    .nt-ftabs { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
    .nt-ftabs::-webkit-scrollbar { display: none; }
    .nt-ftab { font-family: var(--f-sans); font-weight: 600; font-size: 14px; color: var(--fg-soft); background: none; border: 0; border-radius: var(--r); cursor: pointer; padding: 8px 12px; white-space: nowrap; transition: background .13s, color .13s; }
    .nt-ftab:hover { background: var(--paper-3); color: var(--fg); }
    .nt-ftab.on { background: var(--green-tint); color: var(--green-700); }
    .nt-feedctl { display: flex; align-items: center; gap: 10px; margin-left: auto; flex: none; }
    .nt-feedctl .nt-rsrch { width: 190px; padding: 7px 12px; }
    .nt-feedctl .nt-tab { padding: 6px 12px; font-size: 13px; }
    @media (max-width: 560px) {
      .nt-feedctl { width: 100%; margin-left: 0; }
      /* min-width:0 on BOTH the field and its input: a search input carries a default intrinsic width, so without
         it the control refuses to shrink and the scope toggle beside it is pushed off the edge. */
      .nt-feedctl .nt-rsrch { flex: 1 1 120px; width: auto; min-width: 0; }
      .nt-feedctl .nt-rsrch input { min-width: 0; }
      .nt-feedctl .nt-tab { padding: 6px 10px; }
    }

    .nt-feed { margin-top: 16px; }
    .muted { color: var(--fg-mute); font-size: 14px; }

    /* In-place reader: a content/Share item opens here (gbti-reader) instead of navigating away; Back restores
       the feed. The feed IS the browser now, so there is no separate Browse page to bounce through. */
    [data-feedview][hidden], [data-readerview][hidden] { display: none; }
    .reader-back { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 18px; padding: 8px 14px; border: 1.5px solid var(--line); border-radius: var(--r); background: var(--paper); color: var(--fg); font-family: var(--f-sans); font-weight: 600; font-size: 13px; cursor: pointer; }
    .reader-back:hover { border-color: var(--green); color: var(--green-700); }

    /* The feed rows/cards render inside <gbti-card-list> (SOW-042), whose styles are shadow-encapsulated; the
       per-mode + atom CSS that used to live here moved into client-ui/src/elements/gbti-card-list.mjs. */

    /* SOW-118: the version + build indicator, fixed bottom-right. A new-tab OVERRIDE hides Chrome's own
       "Customize Chrome" control, so the bottom-right corner is free. Filled + shown by newtab.mjs (hidden
       until the manifest version is read, so it never flashes empty); links to the public changelog. */
    .nt-version { position: fixed; right: 16px; bottom: 12px; z-index: 60; display: none; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 11.5px; color: var(--fg-mute); background: var(--paper); border: 1.5px solid var(--line); border-radius: var(--r); padding: 4px 10px; text-decoration: none; box-shadow: var(--sh-sm); opacity: .82; transition: opacity .14s, color .14s, border-color .14s; }
    .nt-version.show { display: inline-flex; }
    .nt-version:hover { opacity: 1; color: var(--green-700); border-color: var(--green); }

    /* one-time Chrome-footer tip */
    .footertip { display: none; align-items: center; gap: 14px; margin-top: 28px; padding: 12px 16px; border: 1.5px dashed var(--line-2); border-radius: var(--r); background: var(--paper); }
    .footertip.show { display: flex; }
    .footertip .ft-txt { flex: 1; font-size: 13px; color: var(--fg-mute); line-height: 1.5; }
    .footertip .ft-x { flex: none; font-family: var(--f-sans); font-weight: 700; font-size: 13px; color: var(--green-700); background: var(--green-tint); border: 0; border-radius: var(--r-pill); padding: 7px 14px; cursor: pointer; }
    .footertip .ft-x:hover { background: var(--green); color: #fff; }

    /* SOW-018 lapsed-lock splash (full overlay; the rest of the shell is covered) */
    /* SOW-077: the read-only upgrade banner (replaces the old full-screen lock wall). In-flow at the top of the feed,
       dismissible, shown only for the free/lapsed tier by newtab.mjs. */
    .nt-upgrade { display: none; align-items: center; gap: 12px; margin: 0 0 16px; padding: 11px 16px; border: 1.5px solid var(--green); border-radius: var(--r); background: var(--green-tint); }
    .nt-upgrade.show { display: flex; }
    .nt-upgrade .up-ico { flex: none; color: var(--green-700); font-size: 15px; }
    .nt-upgrade .up-txt { flex: 1; font-size: 13px; color: var(--fg); line-height: 1.5; }
    .nt-upgrade .up-cta { flex: none; font-family: var(--f-sans); font-weight: 800; font-size: 13px; color: #fff; background: var(--green); border-radius: var(--r-pill); padding: 7px 16px; }
    .nt-upgrade .up-cta:hover { background: var(--green-700); }
    .nt-upgrade .up-x { flex: none; background: transparent; border: 0; color: var(--fg-mute); cursor: pointer; font-size: 13px; line-height: 1; padding: 4px 6px; }
    .nt-upgrade .up-x:hover { color: var(--fg); }
  </style>
</head>
<body>
  <div class="nt" data-shell data-active="activity">
    <main class="nt-main">
      <!-- sow-296: the page top row. The shell prepends the brand mark and appends the control cluster (apps, the
           view-mode slot, bell, theme, account); newtab.mjs moves the view-mode switch into that cluster. It sits
           OUTSIDE [data-feedview] so the controls stay visible when the in-place reader replaces the feed. -->
      <div class="nt-greet" data-topbar>
        <div class="nt-modes" role="group" aria-label="View mode">
          <button class="nt-mode" type="button" data-mode="compact" data-ico="mCompact" title="Compact" aria-label="Compact view"></button>
          <button class="nt-mode" type="button" data-mode="detailed" data-ico="mDetailed" title="Detailed" aria-label="Detailed view"></button>
          <button class="nt-mode" type="button" data-mode="card" data-ico="mCard" title="Cards" aria-label="Card view"></button>
        </div>
      </div>

      <div data-feedview>
      <!-- sow-296 (owner): "a share prompt in the top center of the extension that we see first thing, as the hero,
           minimalistic, following the style of the homepage". [data-compose] is wired by the shell, so this opens
           the same composer the retired "+" opened, with the same membership states inside it. -->
      <div class="nt-share">
        <button type="button" class="nt-share-open" data-compose aria-haspopup="dialog" aria-label="Post a Share">
          <img class="nt-share-av" data-me-av alt="" width="34" height="34" />
          <span class="nt-share-prompt"><i class="nt-share-caret" aria-hidden="true"></i>Share something with the network&hellip;</span>
          <span class="nt-share-act"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a3 3 0 1 0-2.82-4H15a3 3 0 0 0 .12.83l-6.1 3.55a3 3 0 1 0 0 4.24l6.1 3.55A3 3 0 1 0 18 16a3 3 0 0 0-1.77.58l-6.1-3.55a3 3 0 0 0 0-1.66l6.1-3.55A3 3 0 0 0 18 8Z" fill="currentColor"/></svg>Share</span>
        </button>
      </div>
      <!-- SOW-077: a non-blocking upgrade prompt for a free/lapsed member browsing read-only (replaces the old
           full-screen renew wall). newtab.mjs shows it only for the 'join'/'renew' tiers; banned + active never see it. -->
      <div class="nt-upgrade" data-upgrade>
        <span class="up-ico" aria-hidden="true">✦</span>
        <span class="up-txt" data-upgrade-txt></span>
        <a class="up-cta" data-upgrade-cta href="https://gbti.network/membership/" target="_blank" rel="noopener">Join GBTI</a>
        <button class="up-x" type="button" data-upgrade-dismiss aria-label="Dismiss">✕</button>
      </div>

      <!-- sow-296: the tab row (rendered by newtab.mjs from the shared feed list) plus the feed search and the
           Latest / Following scope, which moved here from the top of the old left rail. -->
      <div class="nt-feednav">
        <div class="nt-ftabs" data-ftabs role="tablist" aria-label="Feeds"></div>
        <div class="nt-feedctl">
          <label class="nt-rsrch"><span class="gl" data-ico="search"></span><input type="search" data-filter placeholder="Filter the feed" autocomplete="off" aria-label="Filter the feed" /></label>
          <div class="nt-tabs" role="tablist" aria-label="Activity view">
            <button class="nt-tab on" type="button" data-tab="latest" role="tab" aria-selected="true">Latest</button>
            <button class="nt-tab" type="button" data-tab="following" role="tab" aria-selected="false">Following</button>
          </div>
        </div>
      </div>

      <div class="nt-feed" data-feed><p class="muted" data-feed-status>Loading the latest from the co-op...</p></div>

      <div class="footertip" data-footertip>
        <span class="ft-txt">Chrome shows its own footer at the very bottom of every new tab. It is a Chrome setting, not part of this extension. To hide it, right-click that footer and choose "Hide footer on New Tab page" (it stays hidden after that).</span>
        <button class="ft-x" type="button" data-footertip-dismiss>Got it</button>
      </div>
      </div><!-- /[data-feedview] -->

      <!-- The in-place reader: a content/Share item opens here; Back restores the feed (no Browse page). -->
      <section data-readerview hidden>
        <button class="reader-back" data-reader-back type="button">&larr; Back to the feed</button>
        <div data-reader></div>
      </section>
    </main>

  </div>
  <!-- SOW-118: version + build indicator (filled + revealed by newtab.mjs), links to the public changelog. -->
  <a class="nt-version" data-version href="https://gbti.network/changelog" target="_blank" rel="noopener" title="View the changelog"><span data-version-text></span></a>
  <script src="dist/newtab.js"></script>
</body>
</html>
